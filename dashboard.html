<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเจ้าหน้าที่ - ระบบรับสมัครนักศึกษาจ้างงานระหว่างเรียน</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --navy: #123f68;
      --navy-dark: #0c3153;
      --blue: #165f9c;
      --yellow: #efb814;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --border: #dde3e9;
      --text: #28343f;
      --muted: #6f7c88;
      --green: #26734d;
      --red: #b4424d;
      --orange: #986b00;
      --sidebar: 272px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: 'Kanit', sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 14px; /* กำหนดขนาดฟอนต์เริ่มต้นให้ใหญ่ขึ้น */
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* ======================================================
       BOOT / SESSION CHECK
    ====================================================== */
    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
    }

    .boot-content {
      width: min(350px, calc(100% - 40px));
      text-align: center;
    }

    .boot-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--navy-dark);
      color: var(--yellow);
      font-size: 26px;
    }

    .boot-title {
      color: var(--navy-dark);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .boot-description {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .boot-progress {
      width: 160px;
      height: 3px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 2px;
      background: #dce3e9;
    }

    .boot-progress::after {
      content: '';
      display: block;
      width: 55px;
      height: 100%;
      background: var(--yellow);
      animation: bootMove 1s ease-in-out infinite;
    }

    @keyframes bootMove {
      0% { transform: translateX(-55px); }
      100% { transform: translateX(160px); }
    }

    /* ======================================================
       LOGIN
    ====================================================== */
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef2f6;
    }

    .login-card {
      width: min(450px, 100%);
      padding: 30px;
      background: #fff;
      border: 1px solid #dce3e9;
      border-top: 5px solid var(--yellow);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(31, 55, 79, .08);
    }

    .login-logo {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      font-size: 24px;
    }

    /* ======================================================
       SIDEBAR
    ====================================================== */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      z-index: 1040;
      display: flex;
      flex-direction: column;
      background: var(--navy-dark);
      color: #fff;
      transition: transform .2s ease;
    }

    .sidebar-brand {
      padding: 21px 17px;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
    }

    .sidebar-brand-badge {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 8px;
      background: var(--yellow);
      color: var(--navy-dark);
      font-size: 20px;
    }

    .brand-title {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: rgba(255, 255, 255, .58);
      font-size: 13px;
      line-height: 1.4;
    }

    .sidebar-menu {
      flex: 1;
      padding: 16px 10px;
      overflow-y: auto;
    }

    .nav-label {
      padding: 0 10px 8px;
      color: rgba(255, 255, 255, .42);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .side-link {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      margin-bottom: 4px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: rgba(255, 255, 255, .72);
      text-align: left;
      font-size: 15px;
    }

    .side-link:hover {
      background: rgba(255, 255, 255, .06);
      color: #fff;
    }

    .side-link.active {
      background: rgba(255, 255, 255, .08);
      color: #fff;
      box-shadow: inset 3px 0 0 var(--yellow);
      font-weight: 500;
    }

    .side-link .icon {
      width: 25px;
      flex: 0 0 auto;
      color: #f2c949;
      text-align: center;
    }

    .menu-count {
      min-width: 21px;
      height: 21px;
      margin-left: auto;
      padding: 0 6px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      background: var(--yellow);
      color: var(--navy-dark);
      font-size: 12px;
      font-weight: 700;
    }

    .sidebar-user {
      margin: 0 10px 11px;
      padding: 12px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      border-radius: 7px;
      background: rgba(255, 255, 255, .03);
    }

    .sidebar-user .text-muted {
      color: rgba(255, 255, 255, .52) !important;
      font-size: 13px;
    }

    #sidebarUserName { color: #fff; font-size: 15px; }

    /* ======================================================
       MAIN
    ====================================================== */
    .main {
      min-height: 100vh;
      margin-left: var(--sidebar);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1020;
      height: 68px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .content {
      width: 100%;
      max-width: 1720px;
      margin: 0 auto;
      padding: 24px 28px 32px;
    }

    .page-title {
      margin-bottom: 3px;
      color: var(--navy-dark);
      font-size: 26px;
      font-weight: 600;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    /* ======================================================
       DASHBOARD CARDS
    ====================================================== */
    .stat-card {
      height: 100%;
      padding: 17px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .stat-number {
      color: var(--navy-dark);
      font-size: 32px;
      font-weight: 650;
      line-height: 1;
    }

    .stat-label {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .stat-icon {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: #edf3f8;
      color: var(--blue);
      font-size: 18px;
    }

    /* ======================================================
       PANEL / TABLE
    ====================================================== */
    .panel {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .panel-header {
      min-height: 58px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      margin: 0;
      color: var(--navy-dark);
      font-size: 18px;
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .table {
      margin: 0;
      vertical-align: middle;
      font-size: 14px;
    }

    .table thead th {
      padding: 11px 12px;
      white-space: nowrap;
      background: #f5f7f9;
      color: #566572;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .table td, .table th {
      padding: 11px 12px;
      border-color: #e9edf1;
    }

    .table tbody tr:hover {
      background: #fafbfd;
    }

    .table tbody tr.selected-row {
      background: #fffaf0;
      box-shadow: inset 3px 0 0 var(--yellow);
    }

    /* ======================================================
       CONTROLS
    ====================================================== */
    .form-control, .form-select {
      border-color: #cfd8e1;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-control:focus, .form-select:focus {
      border-color: #8eb0cc;
      box-shadow: 0 0 0 .15rem rgba(22, 95, 156, .08);
    }

    .btn {
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    .btn-primary {
      background: var(--blue);
      border-color: var(--blue);
    }

    .btn-primary:hover {
      background: #0f5287;
      border-color: #0f5287;
    }

    .form-check-input {
      cursor: pointer;
      border-color: #adb9c4;
    }

    .form-check-input:checked {
      background-color: var(--blue);
      border-color: var(--blue);
    }

    /* ======================================================
       STATUS
    ====================================================== */
    .status-badge {
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      border-radius: 5px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-wait { background: #fff4d6; color: #7a5a00; }
    .badge-pass { background: #e8f3ed; color: #226644; }
    .badge-fail { background: #f9e9eb; color: #9f3440; }
    .badge-info { background: #e8f0f8; color: #195a8b; }
    .badge-muted { background: #edf0f2; color: #56616b; }

    /* ======================================================
       GRAPH
    ====================================================== */
    .bar-row {
      min-height: 44px;
      display: grid;
      grid-template-columns: minmax(210px, 1.4fr) minmax(180px, 3fr) 70px;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #edf0f3;
      font-size: 14px;
    }

    .bar-row:last-child {
      border-bottom: 0;
    }

    .bar-track {
      height: 9px;
      overflow: hidden;
      border-radius: 4px;
      background: #e8edf2;
    }

    .bar-fill {
      height: 100%;
      min-width: 3px;
      background: var(--blue);
    }


    /* ======================================================
       ADMIN INTELLIGENCE DASHBOARD
    ====================================================== */
    .admin-hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid #d8e2ea;
      border-radius: 14px;
      background:
        radial-gradient(circle at 92% 15%, rgba(239,184,20,.22), transparent 24%),
        linear-gradient(135deg, #0c3153 0%, #123f68 62%, #165f9c 100%);
      color: #fff;
      box-shadow: 0 12px 30px rgba(12,49,83,.12);
    }

    .admin-hero::after {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      right: -70px;
      bottom: -120px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
    }

    .admin-hero-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(22px, 2.2vw, 31px);
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .admin-hero-subtitle {
      position: relative;
      z-index: 1;
      margin-top: 5px;
      color: rgba(255,255,255,.7);
      font-size: 13px;
    }

    .admin-hero-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .admin-hero-chip {
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.88);
      font-size: 12px;
      backdrop-filter: blur(8px);
    }

    .admin-refresh-btn {
      position: relative;
      z-index: 1;
      border-color: rgba(255,255,255,.28) !important;
      background: rgba(255,255,255,.08) !important;
      color: #fff !important;
    }

    .admin-refresh-btn:hover {
      background: rgba(255,255,255,.16) !important;
    }

    .intel-kpi-card {
      height: 100%;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(31,55,79,.035);
    }

    .intel-kpi-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .intel-kpi-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 9px;
      background: #edf3f8;
      color: var(--blue);
      font-size: 16px;
    }

    .intel-kpi-value {
      margin-top: 9px;
      color: var(--navy-dark);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .intel-kpi-label {
      color: #627381;
      font-size: 13px;
      font-weight: 500;
    }

    .intel-kpi-meta {
      margin-top: 8px;
      color: #7c8994;
      font-size: 12px;
      line-height: 1.45;
    }

    .intel-positive { color: #24734e; }
    .intel-negative { color: #a73e48; }
    .intel-neutral { color: #6c7a86; }

    .smart-insights {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .smart-insight {
      min-height: 112px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .smart-insight-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--navy-dark);
      font-size: 13px;
      font-weight: 600;
    }

    .smart-insight-icon {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: #f2f5f8;
      color: var(--blue);
    }

    .smart-insight-text {
      color: #647480;
      font-size: 12px;
      line-height: 1.65;
    }

    .smart-insight strong { color: #2a3c4c; }

    .intel-panel {
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
    }

    .intel-panel-head {
      min-height: 61px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .intel-panel-title {
      margin: 0;
      color: var(--navy-dark);
      font-size: 17px;
      font-weight: 600;
    }

    .intel-panel-subtitle {
      margin-top: 3px;
      color: #7b8893;
      font-size: 12px;
    }

    .trend-wrap {
      padding: 12px 14px 8px;
    }

    .trend-svg {
      width: 100%;
      height: auto;
      min-height: 220px;
      overflow: visible;
    }

    .trend-grid-line { stroke: #e8edf2; stroke-width: 1; }
    .trend-axis-label { fill: #83909a; font-size: 11px; font-family: 'Kanit', sans-serif; }
    .trend-area { fill: rgba(22,95,156,.08); }
    .trend-line { fill: none; stroke: #165f9c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .trend-point { fill: #fff; stroke: #165f9c; stroke-width: 2.5; }
    .trend-point-hot { fill: #efb814; stroke: #fff; stroke-width: 2.5; }

    .funnel-list { padding: 13px 15px 15px; }
    .funnel-step { margin-bottom: 13px; }
    .funnel-step:last-child { margin-bottom: 0; }
    .funnel-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .funnel-label { color: #526574; }
    .funnel-value { color: var(--navy-dark); font-weight: 650; }
    .funnel-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1f4;
    }
    .funnel-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #165f9c, #2d79b3);
    }

    .dept-intel-list {
      max-height: 520px;
      overflow: auto;
    }

    .dept-intel-row {
      display: grid;
      grid-template-columns: 44px minmax(240px, 1.6fr) minmax(150px, 1fr) 145px;
      gap: 13px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #edf0f3;
    }

    .dept-intel-row:last-child { border-bottom: 0; }
    .dept-intel-row:hover { background: #fafbfd; }

    .dept-rank {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f0f3f6;
      color: #60717e;
      font-size: 12px;
      font-weight: 700;
    }

    .dept-rank.top {
      background: #fff3cd;
      color: #7b5b00;
    }

    .dept-name {
      color: #293e50;
      font-size: 13px;
      font-weight: 550;
      line-height: 1.45;
    }

    .dept-progress-line {
      height: 6px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9eef2;
    }

    .dept-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    .dept-metric-label {
      color: #8a96a0;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    .dept-metric-value {
      margin-top: 2px;
      color: #324858;
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .analysis-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      border-radius: 999px;
      background: #edf3f8;
      color: #295f86;
      font-size: 11px;
      white-space: nowrap;
    }

    .analysis-badge.warn {
      background: #fff4d6;
      color: #815f00;
    }

    .distribution-list { padding: 14px 16px 16px; }
    .distribution-row { margin-bottom: 12px; }
    .distribution-row:last-child { margin-bottom: 0; }
    .distribution-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .distribution-name {
      max-width: 78%;
      overflow: hidden;
      color: #506474;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .distribution-value { color: var(--navy-dark); font-weight: 650; }
    .distribution-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1f4;
    }
    .distribution-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #efb814, #f2c949);
    }

    .quality-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
      padding: 14px 16px 16px;
    }

    .quality-item {
      padding: 13px;
      border: 1px solid #e5eaee;
      border-radius: 9px;
      background: #fafbfd;
    }
    .quality-value {
      color: var(--navy-dark);
      font-size: 21px;
      font-weight: 700;
      line-height: 1.1;
    }
    .quality-label {
      margin-top: 4px;
      color: #687984;
      font-size: 11px;
    }
    .quality-progress {
      height: 5px;
      margin-top: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #e6ebef;
    }
    .quality-progress > div {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    @media (max-width: 1199.98px) {
      .smart-insights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dept-intel-row { grid-template-columns: 40px minmax(220px, 1.5fr) minmax(130px, 1fr) 135px; }
    }

    @media (max-width: 767.98px) {
      .admin-hero { padding: 18px; }
      .smart-insights { grid-template-columns: 1fr; }
      .trend-wrap { padding-left: 5px; padding-right: 5px; overflow-x: auto; }
      .trend-svg { min-width: 650px; }
      .dept-intel-row {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 9px;
      }
      .dept-intel-row .dept-progress-cell,
      .dept-intel-row .dept-review-metric,
      .dept-intel-row .dept-forward-metric,
      .dept-intel-row .dept-selected-metric { display: none; }
      .quality-grid { grid-template-columns: 1fr; }
    }

    /* ======================================================
       SELECTION / BASKET
    ====================================================== */
    .selection-hero {
      margin-bottom: 16px;
      padding: 17px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--yellow);
      border-radius: 9px;
    }

    .selection-title {
      margin: 0 0 4px;
      color: var(--navy-dark);
      font-size: 22px;
      font-weight: 600;
    }

    .selection-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .basket-widget {
      min-width: 155px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #cbd8e3;
      border-radius: 7px;
      background: #f8fafc;
      color: var(--navy-dark);
      text-align: left;
    }

    .basket-widget:hover {
      background: #f1f5f8;
    }

    .basket-icon-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 6px;
      background: var(--yellow);
      color: var(--navy-dark);
    }

    .basket-badge {
      position: absolute;
      top: -6px;
      right: -7px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      font-size: 11px;
    }

    .basket-widget-label {
      color: var(--muted);
      font-size: 13px;
    }

    .basket-widget-count {
      font-size: 16px;
      font-weight: 600;
    }

    .basket-checkbox-wrap {
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border: 1px solid #d9e0e6;
      border-radius: 5px;
      background: #fff;
    }

    .candidate-name {
      color: #243849;
      font-weight: 500;
    }

    .candidate-code {
      color: #556775;
      font-variant-numeric: tabular-nums;
    }

    /* ======================================================
       RESULT PAGE
    ====================================================== */
    .result-toolbar {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result-summary {
      display: flex;
      flex-wrap: wrap;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .result-summary-item {
      min-width: 125px;
      padding: 10px 14px;
      border-right: 1px solid var(--border);
    }

    .result-summary-item:last-child {
      border-right: 0;
    }

    .result-summary-value {
      color: var(--navy-dark);
      font-size: 20px;
      font-weight: 650;
      line-height: 1.1;
    }

    .result-summary-label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .result-link {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-size: 14px;
    }

    .result-pass { color: var(--green); }
    .result-fail { color: var(--red); }
    .result-wait { color: var(--orange); }

    /* ======================================================
       PROFILE IMAGE
    ====================================================== */
    .photo-thumb {
      width: 45px;
      height: 57px;
      object-fit: cover;
      border: 1px solid #d6dde4;
      border-radius: 5px;
      background: #eef1f4;
    }

    .photo-placeholder {
      width: 45px;
      height: 57px;
      display: grid;
      place-items: center;
      border: 1px solid #d6dde4;
      border-radius: 5px;
      background: #f2f4f6;
      color: #8996a1;
    }

    .profile-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px;
      gap: 20px;
      align-items: start;
    }

    .profile-detail-photo {
      width: 160px;
      height: 200px;
      object-fit: cover;
      border: 1px solid #d8dfe6;
      border-radius: 6px;
      background: #f1f3f5;
    }

    .detail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .detail-item {
      padding: 10px 11px;
      border: 1px solid #e2e7eb;
      border-radius: 6px;
      background: #fafbfc;
    }

    .detail-item.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      margin-bottom: 3px;
      color: #7a8791;
      font-size: 13px;
    }

    .detail-value {
      color: #28343f;
      font-size: 14px;
      word-break: break-word;
    }

    .attachment-chip {
      margin: 2px 4px 2px 0;
      padding: 5px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #cbd8e3;
      border-radius: 5px;
      background: #f7fafc;
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
    }

    /* ======================================================
       MOBILE
    ====================================================== */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      z-index: 1035;
      display: none;
      background: rgba(0, 0, 0, .35);
    }

    .mobile-menu-btn {
      display: none;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-overlay.show {
        display: block;
      }
      .main {
        margin-left: 0;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      .topbar {
        padding: 0 14px;
      }
      .content {
        padding: 18px 14px;
      }
    }

    @media (max-width: 767.98px) {
      .page-title {
        font-size: 22px;
      }
      .selection-hero {
        flex-direction: column;
        align-items: stretch;
      }
      .basket-widget {
        width: 100%;
      }
      .profile-detail-grid {
        grid-template-columns: 1fr;
      }
      .profile-detail-photo {
        margin: 0 auto;
      }
      .detail-list {
        grid-template-columns: 1fr;
      }
      .bar-row {
        padding: 9px 0;
        grid-template-columns: 1fr;
        gap: 5px;
      }
    }
  </style>
</head>

<body>

  <!-- ======================================================
       ตรวจ Session ก่อนแสดง Login หรือ Dashboard
  ======================================================= -->
  <div id="bootView" class="boot-screen">
    <div class="boot-content">
      <div class="boot-logo">
        <i class="fa-solid fa-briefcase"></i>
      </div>
      <div class="boot-title">
        ระบบรับสมัครจ้างงานระหว่างเรียน
      </div>
      <div class="boot-description">
        กำลังตรวจสอบสถานะการเข้าสู่ระบบ
      </div>
      <div class="boot-progress"></div>
    </div>
  </div>

  <!-- ======================================================
       LOGIN
       สำคัญ: d-none ตั้งแต่เริ่มต้น
  ======================================================= -->
  <div id="loginView" class="login-page d-none">
    <div class="login-card">
      <div class="login-logo">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h1 class="h4 fw-bold mb-1" style="color:#00346f;">
        ระบบสำหรับเจ้าหน้าที่
      </h1>
      <p class="text-muted mb-4" style="font-size: 14px;">
        ระบบรับสมัครนักศึกษาจ้างงานระหว่างเรียน ปีงบประมาณ 2570
      </p>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" style="font-size: 14px;">ชื่อผู้ใช้</label>
          <input id="username" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label" style="font-size: 14px;">รหัสผ่าน</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" class="btn btn-primary w-100 py-2">
          <i class="fa-solid fa-right-to-bracket me-2"></i>เข้าสู่ระบบ
        </button>
      </form>

      <button class="btn btn-link w-100 mt-3 text-decoration-none" onclick="backToApplicant()">
        <i class="fa-solid fa-arrow-left me-1"></i>กลับหน้ารับสมัคร
      </button>

  </div>

  <!-- ======================================================
       APP
  ======================================================= -->
  <div id="appView" class="d-none">
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="d-flex align-items-center gap-3">
          <div class="sidebar-brand-badge">
            <i class="fa-solid fa-briefcase"></i>
          </div>
          <div>
            <div class="brand-title">ระบบรับสมัครนักศึกษาจ้างงานระหว่างเรียน</div>
            <div class="brand-subtitle">กองพัฒนานักศึกษา · มหาวิทยาลัยอุบลราชธานี</div>
          </div>
        </div>
      </div>
      <nav id="sidebarMenu" class="sidebar-menu"></nav>
      <div class="sidebar-user">
        <div class="small text-muted">เข้าสู่ระบบในชื่อ</div>
        <div id="sidebarUserName" class="fw-semibold text-truncate"></div>
        <div id="sidebarRole" class="small text-muted text-truncate"></div>
        <button class="btn btn-outline-danger btn-sm w-100 mt-3" onclick="logout()" style="font-size: 14px;">
          <i class="fa-solid fa-right-from-bracket me-1"></i>ออกจากระบบ
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light mobile-menu-btn" onclick="openSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <div id="topTitle" class="fw-semibold" style="font-size: 18px;">ภาพรวม</div>
            <div id="topSubtitle" class="text-muted" style="font-size: 14px;"></div>
          </div>
        </div>
        <button class="btn btn-outline-secondary btn-sm" onclick="backToApplicant()" style="font-size: 14px;">
          <i class="fa-solid fa-house me-1"></i>หน้ารับสมัคร
        </button>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <!-- ======================================================
       MODAL รายชื่อ
  ======================================================= -->
  <div class="modal fade" id="listModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="listModalTitle" class="modal-title" style="font-size: 18px; font-weight: 600;">รายชื่อ</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div id="listModalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- ======================================================
       MODAL ผู้สมัคร
  ======================================================= -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" style="font-size: 18px; font-weight: 600;">ข้อมูลผู้สมัคร</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div id="detailModalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./gas-bridge.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ======================================================
       STATE
    ====================================================== */
    const state = {
      token: '',
      role: '',
      department: '',
      selectionUnit: '',
      displayName: '',
      username: '',
      currentView: '',
      qualificationRows: [],
      adminApplicantRows: [],
      civilRegistryRows: [],
      departmentRows: []
    };

    const listModal = new bootstrap.Modal(document.getElementById('listModal'));
    const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));

    /* ======================================================
       SERVER
    ====================================================== */
    function serverCall(method, ...args) {
      return new Promise((resolve, reject) => {
        try {
          const runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(error => {
              reject(new Error(
                error && error.message ? error.message : 'เกิดข้อผิดพลาดในการเชื่อมต่อระบบ'
              ));
            });

          const fn = runner && runner[method];
          if (typeof fn !== 'function') {
            reject(new Error(`ฟังก์ชัน ${method} ยังไม่มีใน Web App เวอร์ชันที่ Deploy อยู่ กรุณาอัปเดต Code.gs และ Deploy เป็นเวอร์ชันใหม่`));
            return;
          }
          fn.apply(runner, args);
        } catch (error) {
          reject(new Error(
            error && error.message
              ? error.message
              : `ไม่สามารถเรียกฟังก์ชัน ${method} ได้ กรุณาตรวจสอบเวอร์ชันที่ Deploy`
          ));
        }
      });
    }

    /* ======================================================
       GENERAL
    ====================================================== */
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function statusBadge(status) {
      const text = String(status || '-');
      if (text.includes('ไม่ผ่าน') || text.includes('ปฏิเสธ')) {
        return `<span class="status-badge badge-fail">${escapeHtml(text)}</span>`;
      }
      if (text.includes('ผ่าน')) {
        return `<span class="status-badge badge-pass">${escapeHtml(text)}</span>`;
      }
      if (text.includes('พิจารณา')) {
        return `<span class="status-badge badge-info">${escapeHtml(text)}</span>`;
      }
      if (text.includes('รอ')) {
        return `<span class="status-badge badge-wait">${escapeHtml(text)}</span>`;
      }
      return `<span class="status-badge badge-muted">${escapeHtml(text)}</span>`;
    }

    function showLoading(title = 'กำลังโหลดข้อมูล') {
      Swal.fire({
        title,
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });
    }

    function closeLoading() {
      Swal.close();
    }

    function hideBootView() {
      const boot = document.getElementById('bootView');
      if (boot) {
        boot.classList.add('d-none');
      }
    }

    function showLoginView() {
      hideBootView();
      document.getElementById('appView').classList.add('d-none');
      document.getElementById('loginView').classList.remove('d-none');
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').classList.add('show');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
    }

    function backToApplicant() {
      window.location.href = './index.html';
    }

    /* ======================================================
       LOGIN
    ====================================================== */
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('loginBtn');
      const oldHtml = button.innerHTML;
      button.disabled = true;
      button.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> กำลังเข้าสู่ระบบ`;

      try {
        const result = await serverCall(
          'staffLogin',
          document.getElementById('username').value.trim(),
          document.getElementById('password').value
        );

        if (!result || !result.success) {
          throw new Error(result && result.message ? result.message : 'เข้าสู่ระบบไม่สำเร็จ');
        }

        applySession({
          token: result.token,
          role: result.role,
          department: result.department || '',
          selectionUnit: result.selectionUnit || result.department || '',
          displayName: result.displayName || '',
          username: document.getElementById('username').value.trim()
        });

        sessionStorage.setItem('ubuStaffSession', JSON.stringify({
          token: state.token,
          role: state.role,
          department: state.department,
          selectionUnit: state.selectionUnit,
          displayName: state.displayName,
          username: state.username
        }));

        sessionStorage.removeItem('ubuStaffView');
        await enterApp();
      } catch (error) {
        Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: error.message });
      } finally {
        button.disabled = false;
        button.innerHTML = oldHtml;
      }
    });

    function applySession(session) {
      state.token = session.token || '';
      state.role = session.role || '';
      state.department = session.department || '';
      state.selectionUnit = session.selectionUnit || session.department || '';
      state.displayName = session.displayName || '';
      state.username = session.username || '';
    }

    /* ======================================================
       ENTER APP
    ====================================================== */
    async function enterApp() {
      hideBootView();
      document.getElementById('loginView').classList.add('d-none');
      document.getElementById('appView').classList.remove('d-none');
      resetClientIdleTimer();
      document.getElementById('sidebarUserName').textContent = state.displayName || state.username;
      
      document.getElementById('sidebarRole').textContent =
        state.role === 'admin'
          ? 'สิทธิ์ผู้ดูแลระบบ'
          : `สิทธิ์หน่วยงาน · ${state.selectionUnit || state.department}`;

      renderSidebar();
      const savedView = sessionStorage.getItem('ubuStaffView');
      const adminViews = ['adminDashboard', 'applicantReview', 'civilRegistry', 'qualification', 'forwarding', 'adminResults'];
      const departmentViews = ['departmentDashboard', 'departmentSelection', 'departmentBasket'];

      let targetView;
      if (state.role === 'admin') {
        targetView = adminViews.includes(savedView) ? savedView : 'adminDashboard';
      } else {
        targetView = departmentViews.includes(savedView) ? savedView : 'departmentDashboard';
      }
      await navigate(targetView);
    }

    /* ======================================================
       SIDEBAR
    ====================================================== */
    function renderSidebar() {
      const adminItems = [
        ['adminDashboard', 'fa-chart-line', 'ภาพรวมข้อมูลระบบกลาง'],
        ['applicantReview', 'fa-address-card', 'ตรวจสอบข้อมูลรายชื่อผู้สมัคร'],
        ['civilRegistry', 'fa-id-card', 'ตรวจสอบข้อมูลทะเบียนราษฎร'],
        ['qualification', 'fa-user-check', 'ตรวจสอบคุณสมบัติเกรดเฉลี่ย'],
        ['forwarding', 'fa-paper-plane', 'ส่งรายชื่อให้หน่วยงานคัดเลือก'],
        ['adminResults', 'fa-inbox', 'รับข้อมูลส่งกลับจากหน่วยงาน']
      ];
      const departmentItems = [
        ['departmentDashboard', 'fa-chart-pie', 'ภาพรวมข้อมูลหน่วยงาน'],
        ['departmentSelection', 'fa-user-plus', 'คัดเลือกรายชื่อลงตะกร้า'],
        ['departmentBasket', 'fa-basket-shopping', 'ยืนยันส่งรายชื่อที่คัดเลือก']
      ];

      const items = state.role === 'admin' ? adminItems : departmentItems;

      document.getElementById('sidebarMenu').innerHTML = `
        <div class="nav-label">เมนูการทำงาน</div>
        ${items.map(([key, icon, label]) => `
          <button class="side-link" data-view="${key}" onclick="navigate('${key}')">
            <span class="icon"><i class="fa-solid ${icon}"></i></span>
            <span>${escapeHtml(label)}</span>
            ${key === 'departmentBasket' ? `<span id="sidebarBasketBadge" class="menu-count d-none">0</span>` : ''}
          </button>
        `).join('')}
      `;
    }

    async function navigate(view) {
      state.currentView = view;
      sessionStorage.setItem('ubuStaffView', view);
      closeSidebar();

      document.querySelectorAll('.side-link').forEach(button => {
        button.classList.toggle('active', button.dataset.view === view);
      });

      try {
        if (view === 'adminDashboard') return await renderAdminDashboard();
        if (view === 'applicantReview') return await renderApplicantReview();
        if (view === 'civilRegistry') return await renderCivilRegistry();
        if (view === 'qualification') return await renderQualification();
        if (view === 'forwarding') return await renderForwarding();
        if (view === 'adminResults') return await renderAdminResults();
        if (view === 'departmentDashboard') return await renderDepartmentDashboard();
        if (view === 'departmentSelection') return await renderDepartmentSelection();
        if (view === 'departmentBasket') return await renderDepartmentBasket();
      } catch (error) {
        if (error.message.includes('เซสชัน')) {
          await forceLogout(error.message);
          return;
        }
        Swal.fire({ icon: 'error', title: 'ไม่สามารถโหลดข้อมูลได้', text: error.message });
      }
    }

    function setHeader(title, subtitle = '') {
      document.getElementById('topTitle').textContent = title;
      document.getElementById('topSubtitle').textContent = subtitle;
    }

    function statCard(icon, number, label) {
      return `
        <div class="col-6 col-xl-3">

    function buildAdminTrendChart(points) {
      const data = Array.isArray(points) ? points : [];
      if (!data.length) return '<div class="text-muted text-center py-5">ยังไม่มีข้อมูลแนวโน้ม</div>';
      const width = 760;
      const height = 238;
      const left = 38;
      const right = 20;
      const top = 20;
      const bottom = 40;
      const chartW = width - left - right;
      const chartH = height - top - bottom;
      const maxValue = Math.max(1, ...data.map(x => Number(x.count || 0)));
      const stepX = data.length > 1 ? chartW / (data.length - 1) : chartW;
      const yFor = value => top + chartH - (Number(value || 0) / maxValue * chartH);
      const coords = data.map((item, index) => ({
        x: left + (index * stepX),
        y: yFor(item.count),
        count: Number(item.count || 0),
        label: item.label || ''
      }));
      const line = coords.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const baseY = top + chartH;
      const area = `${left},${baseY} ${line} ${coords[coords.length - 1].x.toFixed(1)},${baseY}`;
      const hottest = Math.max(...coords.map(p => p.count));
      const grid = [0, .25, .5, .75, 1].map(r => {
        const y = top + chartH - (r * chartH);
        const val = Math.round(maxValue * r);
        return `<line class="trend-grid-line" x1="${left}" y1="${y}" x2="${width-right}" y2="${y}"></line><text class="trend-axis-label" x="4" y="${y+4}">${val}</text>`;
      }).join('');
      const labels = coords.map((p, index) => index % 2 === 0 || index === coords.length - 1
        ? `<text class="trend-axis-label" text-anchor="middle" x="${p.x}" y="${height-13}">${escapeHtml(p.label)}</text>`
        : '').join('');
      const dots = coords.map(p => `<circle class="${p.count === hottest && hottest > 0 ? 'trend-point-hot' : 'trend-point'}" cx="${p.x}" cy="${p.y}" r="4.5"><title>${escapeHtml(p.label)}: ${p.count} คน</title></circle>`).join('');
      return `<svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="แนวโน้มจำนวนผู้สมัคร 14 วัน">${grid}<polygon class="trend-area" points="${area}"></polygon><polyline class="trend-line" points="${line}"></polyline>${dots}${labels}</svg>`;
    }

    function buildAdminFunnel(funnel) {
      const rows = Array.isArray(funnel) ? funnel : [];
      const max = Math.max(1, Number(rows[0]?.count || 0));
      return rows.length ? rows.map((item, index) => {
        const count = Number(item.count || 0);
        const rate = max ? count / max * 100 : 0;
        return `
          <div class="funnel-step">
            <div class="funnel-label-row">
              <div class="funnel-label">${index + 1}. ${escapeHtml(item.label || '-')}</div>
              <div class="funnel-value">${count.toLocaleString('th-TH')} <span class="text-muted fw-normal">(${rate.toFixed(1)}%)</span></div>
            </div>
            <div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(count ? 3 : 0, rate)}%"></div></div>
          </div>`;
      }).join('') : '<div class="text-muted text-center py-4">ยังไม่มีข้อมูล</div>';
    }

    function buildDepartmentIntelligence(stats) {
      const rows = Array.isArray(stats) ? stats : [];
      const max = Math.max(1, ...rows.map(x => Number(x.count || 0)));
      if (!rows.length) return '<div class="text-muted text-center py-5">ยังไม่มีข้อมูลการสมัคร</div>';
      return rows.map((item, index) => {
        const count = Number(item.count || 0);
        const relative = count / max * 100;
        const pending = Number(item.pendingReview || 0);
        return `
          <div class="dept-intel-row">
            <div class="dept-rank ${index < 3 ? 'top' : ''}">${index + 1}</div>
            <div>

    function buildFacultyDistribution(rows) {
      const data = Array.isArray(rows) ? rows : [];

      return data.length ? data.map(item => `

    function maskThaiIdClient(value) {
      const id = String(value || '').replace(/\D/g, '');
      if (id.length !== 13) return id || '-';
      return `${id.slice(0, 1)}-XXXX-XXXXX-${id.slice(-3)}`;
    }

    function civilChecksumBadge(status) {
      const value = String(status || 'ยังไม่ตรวจสอบ');
      if (value === 'ถูกต้อง') return `<span class="status-badge badge-pass"><i class="fa-solid fa-check me-1"></i>ถูกต้อง</span>`;
      if (value === 'ไม่ถูกต้อง') return `<span class="status-badge badge-fail"><i class="fa-solid fa-xmark me-1"></i>ไม่ถูกต้อง</span>`;
      return `<span class="status-badge badge-wait">ยังไม่ตรวจสอบ</span>`;
    }

    function civilRegistryValueBadge(value) {
      const text = String(value || '').trim();
      if (!text) return `<span class="text-muted">-</span>`;
      return `<span class="status-badge badge-info">${escapeHtml(text)}</span>`;
    }

    function civilVerificationBadge(status) {
      const value = String(status || 'ยังไม่ตรวจสอบ');
      if (value === 'ตรวจสอบเลขประจำตัวแล้ว') return `<span class="status-badge badge-pass">ตรวจสอบแล้ว</span>`;
      if (value.includes('ตรวจสอบไม่ได้') || value.includes('ไม่สำเร็จ')) return `<span class="status-badge badge-fail">${escapeHtml(value)}</span>`;
      return `<span class="status-badge badge-wait">${escapeHtml(value)}</span>`;
    }

    function toggleAllCivilRegistryRows(source) {
      document.querySelectorAll('#civilRegistryBody tr:not([style*="display: none"]) .civil-row-check').forEach(box => {
        box.checked = !!source.checked;
      });
    }

    function filterCivilRegistryTable() {
      const search = (document.getElementById('civilRegistrySearch')?.value || '').trim().toLowerCase();
      const filter = document.getElementById('civilRegistryFilter')?.value || '';
      document.querySelectorAll('#civilRegistryBody tr[data-search]').forEach(row => {
        const matchSearch = !search || row.dataset.search.includes(search);
        const matchFilter = !filter || row.dataset.filterState === filter;
        row.style.display = matchSearch && matchFilter ? '' : 'none';
      });
      const selectAll = document.getElementById('civilRegistrySelectAll');
      if (selectAll) selectAll.checked = false;
    }

    async function runCivilRegistrySingle(applicationId) {
      await runCivilRegistryIds([applicationId]);
    }

    async function runCivilRegistryCheck(mode) {
      let ids = [];
      if (mode === 'all') {
        ids = state.civilRegistryRows.map(item => item.applicationId).filter(Boolean);
      } else {
        ids = [...document.querySelectorAll('.civil-row-check:checked')].map(box => box.value).filter(Boolean);
      }
      if (!ids.length) {
        Swal.fire({ icon: 'info', title: 'ยังไม่ได้เลือกรายชื่อ', text: 'กรุณาเลือกรายชื่อที่ต้องการตรวจสอบ' });
        return;
      }

      const confirm = await Swal.fire({
        icon: 'question',
        title: mode === 'all' ? 'ตรวจสอบผู้สมัครทั้งหมด' : `ตรวจสอบ ${ids.length} รายการ`,
        html: `<div class="text-start" style="font-size:14px;">ระบบจะตรวจความถูกต้องของเลขประจำตัวประชาชน 13 หลัก</div>`,
        showCancelButton: true,
        confirmButtonText: 'เริ่มตรวจสอบ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#165f9c'
      });
      if (!confirm.isConfirmed) return;
      await runCivilRegistryIds(ids);
    }

    async function runCivilRegistryIds(ids) {
      showLoading(`กำลังตรวจสอบ ${ids.length} รายการ`);
      try {
        const totals = { processed:0, validId:0, invalidId:0, autoFilled:0 };
        const allErrors = [];
        const chunkSize = 50;
        for (let i = 0; i < ids.length; i += chunkSize) {
          const batchIds = ids.slice(i, i + chunkSize);
          const updates = batchIds.map(applicationId => {
            const row = state.civilRegistryRows.find(item => item.applicationId === applicationId) || {};
            return {
              applicationId,
              idValidationOnly: true,
              // ส่งค่าคุณสมบัติเดิมไปด้วยเพื่อความเข้ากันได้ หาก Web App ยัง cache โค้ดช่วงเปลี่ยนเวอร์ชัน
              result: row.qualificationResult || 'pending',
              reason: row.qualificationReason || '',
              visible: !!row.qualificationVisible
            };
          });
          const result = await serverCall('saveQualificationReviews', state.token, updates);
          if (!result || typeof result.processed === 'undefined') {
            throw new Error('ยังไม่สามารถบันทึกผลตรวจเลข 13 หลักได้ กรุณา Deploy Code.gs ตัวล่าสุดอีกครั้ง แล้วรีเฟรชหน้าเว็บ');
          }
          Object.keys(totals).forEach(key => totals[key] += Number(result && result[key] || 0));
          if (Array.isArray(result && result.errors)) allErrors.push(...result.errors);
        }
        closeLoading();
        await Swal.fire({
          icon: totals.invalidId ? 'warning' : 'success',
          title: 'ตรวจสอบเรียบร้อย',
          html: `
            <div class="text-start mx-auto" style="max-width:460px;font-size:14px;">
              <div>ประมวลผล <strong>${totals.processed}</strong> รายการ</div>
              <div>เลข 13 หลักถูกต้อง <strong>${totals.validId}</strong> รายการ</div>
              <div>เลข 13 หลักไม่ถูกต้อง <strong>${totals.invalidId}</strong> รายการ</div>
              <div>เติมค่ามาตรฐานอัตโนมัติ <strong>${totals.autoFilled}</strong> รายการ</div>
            </div>`
        });
        await renderCivilRegistry();
      } catch (error) {
        closeLoading();
        Swal.fire({ icon: 'error', title: 'ตรวจสอบไม่สำเร็จ', text: error.message });
      }
    }

    function qualificationResultLabel(result) {
      if (result === 'pass') return 'ผ่านคุณสมบัติ';
      if (result === 'fail') return 'ไม่ผ่านคุณสมบัติ';
      return 'ยังไม่ตรวจสอบ';
    }

    function renderQualificationRows(rows) {
      const body = document.getElementById('qualificationBody');
      body.innerHTML = rows.length ? rows.map((item, index) => {
        const locked = !!item.forwarded;
        const result = ['pass', 'fail'].includes(item.qualificationResult) ? item.qualificationResult : 'pending';
        const verified = item.verifiedGpax !== '' && item.verifiedGpax !== null && item.verifiedGpax !== undefined
          ? Number(item.verifiedGpax).toFixed(2)
          : '-';
        return `
          <tr data-search="${escapeHtml(`${item.studentId} ${item.fullName} ${item.faculty} ${item.department}`.toLowerCase())}"
              data-app-id="${escapeHtml(item.applicationId)}"
              data-qualification-status="${escapeHtml(result)}">
            <td class="text-center">
              <input class="form-check-input qual-select" type="checkbox" ${locked ? 'disabled' : ''}>
            </td>
            <td>${index + 1}</td>
            <td class="candidate-code">${escapeHtml(item.studentId)}</td>
            <td>${escapeHtml(item.fullName)}</td>
            <td>${escapeHtml(item.faculty)}</td>
            <td>${escapeHtml(item.year)}</td>
            <td class="fw-semibold">${escapeHtml(item.gpax || '-')}</td>
            <td class="fw-semibold ${result === 'fail' ? 'result-fail' : result === 'pass' ? 'result-pass' : ''}">${escapeHtml(verified)}</td>
            <td>
              <select class="form-select form-select-sm qual-result" ${locked ? 'disabled' : ''} onchange="onQualificationResultChange(this)">
                <option value="pending" ${result === 'pending' ? 'selected' : ''}>ยังไม่ตรวจสอบ</option>
                <option value="pass" ${result === 'pass' ? 'selected' : ''}>ผ่านคุณสมบัติ</option>
                <option value="fail" ${result === 'fail' ? 'selected' : ''}>ไม่ผ่านคุณสมบัติ</option>
              </select>
            </td>
            <td>
              <input class="form-control form-control-sm qual-reason" value="${escapeHtml(item.qualificationReason || '')}" ${locked ? 'disabled' : ''} placeholder="ระบุสาเหตุกรณีไม่ผ่าน">
            </td>
            <td class="text-center">
              <div class="form-check form-switch d-inline-block">
                <input class="form-check-input qual-visible" type="checkbox" ${item.qualificationVisible ? 'checked' : ''} ${locked ? 'disabled' : ''}>
              </div>
            </td>
            <td>${statusBadge(item.status)}</td>
          </tr>`;
      }).join('') : `<tr><td colspan="12" class="text-center text-muted py-4">ยังไม่มีผู้สมัคร</td></tr>`;
    }

    function onQualificationResultChange(select) {
      const row = select.closest('tr');
      const reason = row.querySelector('.qual-reason');
      const visible = row.querySelector('.qual-visible');
      row.dataset.qualificationStatus = select.value;

      if (select.value === 'fail') {
        if (!reason.value.trim()) reason.value = QUALIFICATION_FAIL_REASON;
        visible.checked = true;
      } else {
        reason.value = '';
        visible.checked = select.value === 'pass';
      }
      filterQualificationTable();
    }

    function toggleQualificationSelectAll(checkbox) {
      document.querySelectorAll('#qualificationBody tr[data-app-id]').forEach(row => {
        if (row.style.display === 'none') return;
        const item = row.querySelector('.qual-select');
        if (item && !item.disabled) item.checked = checkbox.checked;
      });
    }

    function applyQualificationBulkStatus() {
      const result = document.getElementById('qualificationBulkStatus').value;
      if (!result) {
        Swal.fire({ icon: 'info', title: 'กรุณาเลือกสถานะ', text: 'เลือก ผ่าน / ไม่ผ่าน / ยังไม่ตรวจสอบ ก่อนทำรายการ' });
        return;
      }

      const selectedRows = [...document.querySelectorAll('#qualificationBody tr[data-app-id]')]
        .filter(row => row.querySelector('.qual-select')?.checked && !row.querySelector('.qual-select')?.disabled);
      if (!selectedRows.length) {
        Swal.fire({ icon: 'info', title: 'ยังไม่ได้เลือกรายชื่อ', text: 'กรุณาเลือกรายชื่ออย่างน้อย 1 คน' });
        return;
      }

      selectedRows.forEach(row => {
        const select = row.querySelector('.qual-result');
        select.value = result;
        onQualificationResultChange(select);
      });
      Swal.fire({ icon: 'success', title: 'ปรับสถานะในตารางแล้ว', text: `ปรับ ${selectedRows.length} รายการเป็น “${qualificationResultLabel(result)}” กรุณากดบันทึกการปรับแก้` });
    }

    function filterQualificationTable() {
      const search = (document.getElementById('qualificationSearch')?.value || '').trim().toLowerCase();
      const status = document.getElementById('qualificationStatusFilter')?.value || 'all';
      document.querySelectorAll('#qualificationBody tr[data-search]').forEach(row => {
        const matchSearch = row.dataset.search.includes(search);
        const matchStatus = status === 'all' || row.dataset.qualificationStatus === status;
        row.style.display = matchSearch && matchStatus ? '' : 'none';
      });
      const selectAll = document.getElementById('qualificationSelectAll');
      if (selectAll) selectAll.checked = false;
    }

    async function saveQualification() {
      const updates = [...document.querySelectorAll('#qualificationBody tr[data-app-id]')].map(row => {
        const result = row.querySelector('.qual-result').value || 'pending';
        let reason = row.querySelector('.qual-reason').value.trim();
        const visible = row.querySelector('.qual-visible').checked;
        if (result === 'fail' && !reason) reason = QUALIFICATION_FAIL_REASON;
        if (result !== 'fail') reason = '';
        return { applicationId: row.dataset.appId, result, reason, visible };
      });

      const confirm = await Swal.fire({
        icon: 'question',
        title: 'บันทึกผลการตรวจสอบ',
        text: 'ผลที่เปิดให้แสดงจะปรากฏในหน้าตรวจสอบของนักศึกษา',
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#165f9c'
      });
      if (!confirm.isConfirmed) return;

      showLoading('กำลังบันทึกผล');
      try {
        const result = await serverCall('saveQualificationReviews', state.token, updates);
        closeLoading();
        await Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย', text: `อัปเดต ${result.updated || 0} รายการ` });
        await renderQualification();
      } catch (error) {
        closeLoading();
        Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: error.message });
      }

      const header = ['ประทับเวลา', 'คำนำหน้า', 'ชื่อ (ไม่ต้องมีคำนำหน้า)', 'นามสกุล', 'เลขบัตรประจำตัวประชาชน', 'รหัสนักศึกษา', 'สังกัดคณะ'];
      const rows = state.qualificationRows.map(item => [
        item.submittedAtExport || item.submittedAt || '',
        item.prefix || '',
        item.firstName || '',
        item.lastName || '',
        String(item.idCard || ''),
        String(item.studentId || ''),
        item.faculty || ''
      ]);

      if (!window.XLSX) {
        downloadCsv('รายชื่อสำหรับตรวจสอบคุณสมบัติ.csv', [header, ...rows]);
        return;
      }

      const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
      ws['!cols'] = [
        { wch: 22 }, { wch: 15 }, { wch: 28 }, { wch: 28 }, { wch: 22 }, { wch: 18 }, { wch: 35 }
      ];

      // ระบบตรวจสอบภายนอกใช้ตัวอ่าน Excel รุ่นเก่า
      // จึงต้องสร้างไฟล์ .xls แบบ BIFF8 จริง ไม่ใช่ .xlsx แล้วเปลี่ยนนามสกุล
      const wb = XLSX.utils.book_new();

      link.remove();
      URL.revokeObjectURL(url);

    async function readQualificationResultRows(file) {
      const bytes = await file.arrayBuffer();
      const recordsFromHtml = readQualificationRowsFromHtml(bytes);
      if (recordsFromHtml.length) return recordsFromHtml;

      if (!window.XLSX) {
        throw new Error('ไลบรารีอ่าน Excel ยังโหลดไม่สำเร็จ กรุณารีเฟรชหน้าแล้วลองใหม่');
      }

      let workbook;
      try {
        workbook = XLSX.read(bytes, { type: 'array', raw: false, cellText: true });
      } catch (err) {
        throw new Error('รูปแบบไฟล์ไม่รองรับ กรุณาใช้ไฟล์ .xls, .xlsx หรือ .csv ที่เปิดตารางข้อมูลได้');
      }

      const records = [];
      const seen = new Set();
      (workbook.SheetNames || []).forEach(sheetName => {
        const sheet = workbook.Sheets[sheetName];
        if (!sheet) return;
        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: '',
          raw: false,
          blankrows: false
        });
        extractQualificationRecordsFromRows(rows, records, seen);
      });

      if (!records.length) {
        const text = decodeQualificationFileText(bytes);
        if (/WorksheetSource\s+HRef=.*\.files\//i.test(text) || /sheet001\.htm/i.test(text)) {
          throw new Error('ไฟล์ .xls นี้เป็น Excel แบบหลายไฟล์ และตัวข้อมูลจริงอยู่ในโฟลเดอร์ .files ที่ไม่ได้แนบมาด้วย กรุณาเปิดไฟล์แล้ว Save As เป็น Excel Workbook (.xls หรือ .xlsx) แบบไฟล์เดียวก่อนนำเข้า');
        }
      }
      return records;
    }

    function readQualificationRowsFromHtml(bytes) {
      const text = decodeQualificationFileText(bytes);
      const head = text.slice(0, 1000).toLowerCase();
      if (!head.includes('<html') && !head.includes('<!doctype html')) return [];

      const doc = new DOMParser().parseFromString(text, 'text/html');
      const records = [];
      const seen = new Set();

      doc.querySelectorAll('table').forEach(table => {
        const rows = [...table.querySelectorAll('tr')].map(tr =>
          [...tr.querySelectorAll('th,td')].map(cell =>
            String(cell.textContent || '')
              .replace(/\u00a0/g, ' ')
              .replace(/[\t\r\n]+/g, ' ')
              .replace(/\s+/g, ' ')
              .trim()
          )
        );
        extractQualificationRecordsFromRows(rows, records, seen);
      });

      return records;
    }

    function decodeQualificationFileText(bytes) {
      try {
        return new TextDecoder('utf-8').decode(bytes);
      } catch (_) {
        const arr = new Uint8Array(bytes);
        let out = '';
        const limit = Math.min(arr.length, 2000000);
        for (let i = 0; i < limit; i++) out += String.fromCharCode(arr[i]);
        return out;
      }
    }

    function normalizeQualificationHeader(value) {
      return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function findQualificationColumnIndexes(rows) {
      for (let r = 0; r < Math.min(rows.length, 30); r++) {
        const row = Array.isArray(rows[r]) ? rows[r] : [];
        let studentIdIndex = -1;
        let gpaxIndex = -1;

        row.forEach((cell, index) => {
          const h = normalizeQualificationHeader(cell);
          if (studentIdIndex < 0 && (
            h === 'รหัสนักศึกษา' ||
            h.includes('รหัสนักศึกษา') ||
            h === 'student id' ||
            h === 'studentid'
          )) studentIdIndex = index;

          if (gpaxIndex < 0 && (
            h.includes('ผลการเรียนเฉลี่ย') ||
            h.includes('เกรดเฉลี่ย') ||
            h.includes('gpax')
          )) gpaxIndex = index;
        });

        if (studentIdIndex >= 0 && gpaxIndex >= 0) {
          return { headerRow: r, studentIdIndex, gpaxIndex };
        }
      }

      // รูปแบบมาตรฐานจากระบบตรวจสอบ: E = รหัสนักศึกษา, H = GPAX
      return { headerRow: -1, studentIdIndex: 4, gpaxIndex: 7 };
    }

    function parseVerifiedGpax(value) {
      const text = String(value ?? '')
        .replace(/,/g, '.')
        .replace(/\u00a0/g, ' ')
        .trim();
      if (!text) return null;

      // ตัวอย่างจากระบบภายนอก: "2.53 (1/2569)" ต้องอ่าน 2.53 ไม่อ่าน 1/2569
      const candidates = text.match(/\d+(?:\.\d+)?/g) || [];
      for (const token of candidates) {
        const n = Number(token);
        if (Number.isFinite(n) && n >= 0 && n <= 4) return n;
      }
      return null;
    }

    function extractQualificationRecordsFromRows(rows, records, seen) {
      if (!Array.isArray(rows) || !rows.length) return;
      const indexes = findQualificationColumnIndexes(rows);
      const startRow = indexes.headerRow >= 0 ? indexes.headerRow + 1 : 0;

      for (let index = startRow; index < rows.length; index++) {
        const row = Array.isArray(rows[index]) ? rows[index] : [];
        const idRaw = String(row[indexes.studentIdIndex] ?? '');
        const idMatch = idRaw.match(/\d{8,13}/);
        const studentId = idMatch ? idMatch[0] : '';
        if (!/^\d{8,13}$/.test(studentId) || seen.has(studentId)) continue;

        const gradeRaw = row[indexes.gpaxIndex];
        const verifiedGpax = parseVerifiedGpax(gradeRaw);
        if (verifiedGpax === null) {
          // มีรหัสจริงแต่ช่องเกรดอ่านไม่ได้ ให้ส่งไป backend เพื่อรายงานเป็น invalid
          if (String(gradeRaw ?? '').trim()) {
            seen.add(studentId);
            records.push({ studentId, verifiedGpax: null, sourceRow: index + 1 });
          }
          continue;
        }

        seen.add(studentId);
        records.push({ studentId, verifiedGpax, sourceRow: index + 1 });
      }
    }

    function downloadCsv(filename, rows) {
      const quote = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
      const csv = '\uFEFF' + rows.map(row => row.map(quote).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function sendToDepartment(index) {
      const group = window.forwardingGroups[index];
      const confirm = await Swal.fire({
        icon: 'question',
        title: 'ส่งรายชื่อให้หน่วยงาน',
        html: `ส่งผู้ผ่านคุณสมบัติที่ยังไม่ส่งจำนวน <strong>${group.unforwardedPass}</strong> คน<br>ไปยัง <strong>${escapeHtml(group.label || group.selectionUnit || group.department)}</strong>`,
        showCancelButton: true,
        confirmButtonText: 'ยืนยันส่ง',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#165f9c'
      });

      if (!confirm.isConfirmed) return;

      showLoading('กำลังส่งรายชื่อ');
      try {
        const result = await serverCall('forwardQualifiedApplicants', state.token, group.department, group.selectionUnit);
        closeLoading();
        await Swal.fire({ icon: 'success', title: 'ส่งรายชื่อเรียบร้อย', text: result.message });
        await renderForwarding();
      } catch (error) {
        closeLoading();
        Swal.fire({ icon: 'error', title: 'ส่งรายชื่อไม่สำเร็จ', text: error.message });
      }
    }

    /* ======================================================
       GROUP LIST
    ====================================================== */
    function showGroupList(mode, index, type) {
      const source = mode === 'forward' ? window.forwardingGroups : window.resultGroups;
      const group = source[index];
      let list = [];
      let title = '';

      if (mode === 'forward') {
        list = type === 'pass' ? group.passApplicants : group.failApplicants;
        title = `${group.label || group.selectionUnit || group.department} · ${type === 'pass' ? 'ผ่านคุณสมบัติ' : 'ไม่ผ่านคุณสมบัติ'}`;
      } else {
        if (type === 'selected') list = group.selectedApplicants;
        if (type === 'rejected') list = group.rejectedApplicants;
        if (type === 'pending') list = group.pendingApplicants;
        title = `${group.label || group.selectionUnit || group.department} · ${type === 'selected' ? 'พิจารณารับ' : type === 'rejected' ? 'ไม่พิจารณารับ' : 'รอผลการพิจารณา'}`;
      }

      document.getElementById('listModalTitle').textContent = title.replace(/\s+/g, ' ').trim();
      document.getElementById('listModalBody').innerHTML = list && list.length ? `
        <div class="table-responsive">
          <table class="table table-sm">

              <tr><th>รหัสนักศึกษา</th><th>ชื่อ-สกุล</th><th>คณะ</th><th>ตำแหน่งงาน</th></tr>

                </tr>
              `).join('')}

    /* ======================================================

    ====================================================== */
    function buildDepartmentResultRows(group) {
      const unit = group.label || group.selectionUnit || group.department || '';
      const rows = [];
      (group.selectedApplicants || []).forEach(item => rows.push([unit, item.studentId || '', item.fullName || '', item.faculty || '', item.job || '', 'พิจารณารับ', item.status || '']));
      (group.rejectedApplicants || []).forEach(item => rows.push([unit, item.studentId || '', item.fullName || '', item.faculty || '', item.job || '', 'ไม่พิจารณารับ', item.status || '']));
      (group.pendingApplicants || []).forEach(item => rows.push([unit, item.studentId || '', item.fullName || '', item.faculty || '', item.job || '', 'รอผลการพิจารณา', item.status || '']));
      return rows;
    }

    function safeFilenamePart(value) {
      return String(value || 'รายชื่อ').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 90) || 'รายชื่อ';
    }

    function downloadDepartmentResult(index) {
      const group = (window.resultGroups || [])[index];
      if (!group) return;
      const rows = buildDepartmentResultRows(group);
      if (!rows.length) {
        Swal.fire({ icon: 'info', title: 'ยังไม่มีรายชื่อ', text: 'หน่วยงานนี้ยังไม่มีข้อมูลสำหรับดาวน์โหลด' });
        return;

      const header = ['หน่วยงาน / งานย่อย', 'รหัสนักศึกษา', 'ชื่อ-สกุล', 'คณะ', 'ตำแหน่งงาน', 'ผลการพิจารณา', 'สถานะ'];
      const name = safeFilenamePart(group.label || group.selectionUnit || group.department);
      downloadCsv(`ผลการคัดเลือก_${name}.csv`, [header, ...rows]);
    }

    function downloadAllDepartmentResults() {
      const groups = window.resultGroups || [];

    function filterDepartmentTable() {
      const input = document.getElementById('departmentSearch');
      if (!input) return;
      const value = input.value.trim().toLowerCase();
      document.querySelectorAll('#departmentBody tr[data-search]').forEach(row => {
        row.style.display = row.dataset.search.includes(value) ? '' : 'none';
      });
    }

    async function loadDepartmentPhotos(rows) {
      const ids = rows.filter(item => item.hasPhoto).map(item => item.applicationId);
      for (let index = 0; index < ids.length; index += 3) {
        const chunk = ids.slice(index, index + 3);
        try {
          const photos = await serverCall('getStaffApplicantPhotoBatch', state.token, chunk);
          chunk.forEach(id => {
            const data = photos && photos[id];
            const wrapper = document.getElementById(`photo-wrap-${id}`);
            if (!wrapper || !data) return;
            wrapper.outerHTML = `<img id="photo-wrap-${escapeHtml(id)}" class="photo-thumb" src="${data}" alt="รูปผู้สมัคร">`;
          });
        } catch (error) {
          console.warn('ไม่สามารถโหลดรูปผู้สมัครบางรายการได้', error);
        }
      }
    }

    async function toggleBasket(applicationId, checkbox) {
      const row = checkbox.closest('tr');
      const previous = !checkbox.checked;
      checkbox.disabled = true;

      try {
        await serverCall('setDepartmentBasket', state.token, applicationId, checkbox.checked);
        const item = (state.departmentRows || []).find(record => record.applicationId === applicationId);
        if (item) item.inBasket = checkbox.checked;

        if (row) {
          row.classList.toggle('selected-row', checkbox.checked);
          const statusCell = row.querySelector('.row-status');
          if (statusCell) {
            statusCell.innerHTML = statusBadge(checkbox.checked ? 'อยู่ในตะกร้า' : 'รอพิจารณา');
          }
        }
        updateBasketIndicator();
      } catch (error) {
        checkbox.checked = previous;
        Swal.fire({ icon: 'error', title: 'ทำรายการไม่สำเร็จ', text: error.message });
      } finally {
        checkbox.disabled = false;
      }
    }
