<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเจ้าหน้าที่ - ระบบรับสมัครนักศึกษาจ้างงานระหว่างเรียน</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="./dashboard.css">
</head>

<body>

  <!-- ======================================================
       ตรวจ Session ก่อนแสดง Login หรือ Dashboard
  ======================================================= -->
  <div id="bootView" class="boot-screen">
    <div class="boot-content">
      <div class="boot-logo">
        <i class="fa-solid fa-briefcase"></i>
      </div>
      <div class="boot-title">
        ระบบรับสมัครจ้างงานระหว่างเรียน
      </div>
      <div class="boot-description">
        กำลังตรวจสอบสถานะการเข้าสู่ระบบ
      </div>
      <div class="boot-progress"></div>
    </div>
  </div>

  <!-- ======================================================
       LOGIN
       สำคัญ: d-none ตั้งแต่เริ่มต้น
  ======================================================= -->
  <div id="loginView" class="login-page d-none">
    <div class="login-card">
      <div class="login-logo">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h1 class="h4 fw-bold mb-1" style="color:#00346f;">
        ระบบสำหรับเจ้าหน้าที่
      </h1>
      <p class="text-muted mb-4" style="font-size: 14px;">
        ระบบรับสมัครนักศึกษาจ้างงานระหว่างเรียน ปีงบประมาณ 2570
      </p>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" style="font-size: 14px;">ชื่อผู้ใช้</label>
          <input id="username" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label" style="font-size: 14px;">รหัสผ่าน</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" class="btn btn-primary w-100 py-2">
          <i class="fa-solid fa-right-to-bracket me-2"></i>เข้าสู่ระบบ
        </button>
      </form>

      <button class="btn btn-link w-100 mt-3 text-decoration-none" onclick="backToApplicant()">
        <i class="fa-solid fa-arrow-left me-1"></i>กลับหน้ารับสมัคร
      </button>
    </div>
  </div>

  <!-- ======================================================
       APP
  ======================================================= -->
  <div id="appView" class="d-none">
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="d-flex align-items-center gap-3">
          <div class="sidebar-brand-badge">
            <i class="fa-solid fa-briefcase"></i>
          </div>
          <div>
            <div class="brand-title">ระบบรับสมัครนักศึกษาจ้างงานระหว่างเรียน</div>
            <div class="brand-subtitle">กองพัฒนานักศึกษา · มหาวิทยาลัยอุบลราชธานี</div>
          </div>
        </div>
      </div>
      <nav id="sidebarMenu" class="sidebar-menu"></nav>
      <div class="sidebar-user">
        <div class="small text-muted">เข้าสู่ระบบในชื่อ</div>
        <div id="sidebarUserName" class="fw-semibold text-truncate"></div>
        <div id="sidebarRole" class="small text-muted text-truncate"></div>
        <button class="btn btn-outline-danger btn-sm w-100 mt-3" onclick="logout()" style="font-size: 14px;">
          <i class="fa-solid fa-right-from-bracket me-1"></i>ออกจากระบบ
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light mobile-menu-btn" onclick="openSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <div id="topTitle" class="fw-semibold" style="font-size: 18px;">ภาพรวม</div>
            <div id="topSubtitle" class="text-muted" style="font-size: 14px;"></div>
          </div>
        </div>
        <button class="btn btn-outline-secondary btn-sm" onclick="backToApplicant()" style="font-size: 14px;">
          <i class="fa-solid fa-house me-1"></i>หน้ารับสมัคร
        </button>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <!-- ======================================================
       MODAL รายชื่อ
  ======================================================= -->
  <div class="modal fade" id="listModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="listModalTitle" class="modal-title" style="font-size: 18px; font-weight: 600;">รายชื่อ</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div id="listModalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- ======================================================
       MODAL ผู้สมัคร
  ======================================================= -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" style="font-size: 18px; font-weight: 600;">ข้อมูลผู้สมัคร</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div id="detailModalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./gas-bridge.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="./dashboard.js"></script>
</body>
</html>
